# Production stack for a single VPS. Lives on the host next to a `.env` file (see `.env.example`
# in this folder). Media is stored in Cloudflare R2, not on the host.
#   docker compose -f compose.prod.yaml pull && docker compose -f compose.prod.yaml up -d
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web, api]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: remember
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: remember_me
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U remember -d remember_me']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: ${IMAGE_PREFIX}/migrate:${IMAGE_TAG}
    environment:
      DATABASE_URL: postgresql://remember:${POSTGRES_PASSWORD}@postgres:5432/remember_me
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${IMAGE_PREFIX}/api:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DATABASE_URL: postgresql://remember:${POSTGRES_PASSWORD}@postgres:5432/remember_me
      WEB_ORIGIN: https://${WEB_DOMAIN}
      GRANT_SIGNING_SECRET: ${GRANT_SIGNING_SECRET}
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: auto
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: 'true'
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_ID_PREMIUM: ${STRIPE_PRICE_ID_PREMIUM}
      STRIPE_PRICE_ID_CUSTOM_SLUG: ${STRIPE_PRICE_ID_CUSTOM_SLUG}
      EVENT_BUS_DRIVER: memory
      # Email is optional: with the defaults nothing is sent and the anniversary email waits.
      MAIL_DRIVER: ${MAIL_DRIVER:-log}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Caddy is the one proxy in front of the API.
      TRUST_PROXY_HOPS: 1
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:4000/health']
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    image: ${IMAGE_PREFIX}/web:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
