# Local infrastructure. `docker compose up -d postgres storage` is enough for `pnpm dev`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: remember
      POSTGRES_PASSWORD: remember
      POSTGRES_DB: remember_me
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U remember -d remember_me']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage standing in for Cloudflare R2. Objects are publicly readable.
  storage:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: remember-me
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: 'true'
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /data
    ports:
      - '9090:9090'
    volumes:
      - storage-data:/data

volumes:
  storage-data:
  postgres-data:
