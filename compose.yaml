# Local infrastructure. `docker compose up -d postgres storage` is enough for `pnpm dev`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: remember
      POSTGRES_PASSWORD: remember
      POSTGRES_DB: remember_me
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U remember -d remember_me']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage standing in for Cloudflare R2. Objects are publicly readable and are
  # lost when the container is recreated: this is a development stand-in, not a place to keep files.
  storage:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: remember-me
    ports:
      - '9090:9090'
    healthcheck:
      test:
        ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:9090/remember-me?list-type=2']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
