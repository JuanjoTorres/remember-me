# Local infrastructure. `docker compose up -d postgres` is enough for `pnpm dev`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: remember
      POSTGRES_PASSWORD: remember
      POSTGRES_DB: remember_me
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U remember -d remember_me']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
