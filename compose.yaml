# Local stack.
#   Infrastructure only (for `pnpm dev`):   docker compose up -d postgres storage
#   Everything, from the Docker images:     docker compose --profile app up --build
# The app profile reads Stripe settings from a `.env` file next to this one (see `.env.example`).
# Without them the stack still starts, but prices and payments do not work.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: remember
      POSTGRES_PASSWORD: remember
      POSTGRES_DB: remember_me
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U remember -d remember_me']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage standing in for Cloudflare R2. Objects are publicly readable and are
  # lost when the container is recreated: this is a development stand-in, not a place to keep files.
  storage:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: remember-me
    ports:
      - '9090:9090'
    healthcheck:
      test:
        ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:9090/remember-me?list-type=2']
      interval: 5s
      timeout: 3s
      retries: 20

  # Applies pending database migrations, then exits. The api waits for it.
  migrate:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://remember:remember@postgres:5432/remember_me
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://remember:remember@postgres:5432/remember_me
      WEB_ORIGIN: http://localhost:3000
      GRANT_SIGNING_SECRET: ${GRANT_SIGNING_SECRET:-local-only-signing-secret-0123456789abcdef}
      # The browser reads media straight from storage, so this is the address as seen from the host.
      MEDIA_PUBLIC_URL: http://localhost:9090/remember-me
      S3_ENDPOINT: http://storage:9090
      S3_BUCKET: remember-me
      S3_ACCESS_KEY_ID: local
      S3_SECRET_ACCESS_KEY: local
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_replace_me}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_replace_me}
      STRIPE_PRICE_ID_PREMIUM: ${STRIPE_PRICE_ID_PREMIUM:-price_replace_me}
      STRIPE_PRICE_ID_CUSTOM_SLUG: ${STRIPE_PRICE_ID_CUSTOM_SLUG:-price_replace_me}
      EVENT_BUS_DRIVER: memory
    ports:
      - '4000:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:4000/health']
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Inlined into the browser bundle: the API as the visitor's browser reaches it.
        NEXT_PUBLIC_API_URL: http://localhost:4000
    environment:
      # Server-side rendering talks to the API container directly.
      INTERNAL_API_URL: http://api:4000
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
