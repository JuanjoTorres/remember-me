name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      INTERNAL_API_URL: http://localhost:4000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check:docs
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      # Integration tests start their own PostgreSQL through Testcontainers (Docker is preinstalled).
      # One package at a time: run together, the API containers starve the web component tests on the
      # runner's few cores and time-sensitive tests fail at random.
      - run: pnpm test --concurrency=1

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      INTERNAL_API_URL: http://localhost:4000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:e2e
