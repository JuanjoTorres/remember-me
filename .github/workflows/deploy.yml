name: Deploy

# Pushing a version tag (v1.2.3) builds the images, publishes them to GHCR and updates the VPS.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api, dockerfile: apps/api/Dockerfile, target: runtime }
          - { name: migrate, dockerfile: apps/api/Dockerfile, target: migrate }
          - { name: web, dockerfile: apps/web/Dockerfile, target: runtime }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.ref_name }}
          # Inlined into the browser bundle of the web image; ignored by the others.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Update the stack
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DIR: ${{ vars.DEPLOY_PATH }}
          TAG: ${{ github.ref_name }}
        run: |
          scp deploy/compose.prod.yaml deploy/Caddyfile scripts/backup.sh "$TARGET:$DIR/"
          ssh "$TARGET" "cd '$DIR' \
            && sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=$TAG/' .env \
            && docker compose -f compose.prod.yaml pull \
            && docker compose -f compose.prod.yaml up -d --remove-orphans \
            && docker image prune -f"
