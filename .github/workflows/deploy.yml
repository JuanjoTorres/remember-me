name: Deploy

# Two environments, each with its own host, secrets and variables (GitHub → Settings → Environments):
#   - staging:    every push to main
#   - production: every version tag (v1.2.3)
# An environment is only deployed once the repository variable STAGING_DEPLOY_ENABLED or
# PRODUCTION_DEPLOY_ENABLED is set to "true", so that merging to main before a server exists does
# not produce failing runs.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  # One deploy at a time per environment; a newer one waits instead of racing the older one.
  group: deploy-${{ github.ref_type == 'tag' && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.plan.outputs.environment }}
      image_tag: ${{ steps.plan.outputs.image_tag }}
      image_prefix: ${{ steps.plan.outputs.image_prefix }}
      enabled: ${{ steps.plan.outputs.enabled }}
    steps:
      - name: Decide environment and image tag
        id: plan
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          # Repository-level switches (environment variables are not readable from this job).
          STAGING_ENABLED: ${{ vars.STAGING_DEPLOY_ENABLED }}
          PRODUCTION_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            # The tag ends up in image names and in a command on the server: plain versions only.
            [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must look like v1.2.3"; exit 1; }
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "image_tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "enabled=$PRODUCTION_ENABLED" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "image_tag=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "enabled=$STAGING_ENABLED" >> "$GITHUB_OUTPUT"
          fi
          # Registry paths must be lowercase.
          echo "image_prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  images:
    needs: plan
    runs-on: ubuntu-latest
    # Gives access to the environment's variables: the web bundle is built for one API address.
    environment: ${{ needs.plan.outputs.environment }}
    if: needs.plan.outputs.enabled == 'true'
    strategy:
      matrix:
        include:
          - { name: api, dockerfile: apps/api/Dockerfile, target: runtime }
          - { name: migrate, dockerfile: apps/api/Dockerfile, target: migrate }
          - { name: web, dockerfile: apps/web/Dockerfile, target: runtime }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          # The web image differs per environment (it embeds the API address), so the environment
          # is part of the image name.
          tags: ${{ needs.plan.outputs.image_prefix }}/${{ needs.plan.outputs.environment }}/${{ matrix.name }}:${{ needs.plan.outputs.image_tag }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha,scope=${{ needs.plan.outputs.environment }}-${{ matrix.name }}
          cache-to: type=gha,scope=${{ needs.plan.outputs.environment }}-${{ matrix.name }},mode=max

  deploy:
    needs: [plan, images]
    runs-on: ubuntu-latest
    environment: ${{ needs.plan.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Update the stack
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DIR: ${{ vars.DEPLOY_PATH }}
          TAG: ${{ needs.plan.outputs.image_tag }}
        run: |
          # Checked again here: this value is interpolated into a command that runs on the server.
          [[ "$TAG" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+|main-[0-9a-f]{7})$ ]] || { echo "Unexpected image tag"; exit 1; }
          [[ -n "$DIR" ]] || { echo "Set the DEPLOY_PATH variable of this environment"; exit 1; }
          chmod +x scripts/backup.sh
          scp -p deploy/compose.prod.yaml deploy/Caddyfile scripts/backup.sh "$TARGET:$DIR/"
          ssh "$TARGET" "cd '$DIR' \
            && sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=$TAG/' .env \
            && docker compose -f compose.prod.yaml pull \
            && docker compose -f compose.prod.yaml up -d --remove-orphans \
            && docker image prune -f"
